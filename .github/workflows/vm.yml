name: vm
on:
  push:
    branches: [main]
    paths: ["app/src/vm/**", ".github/workflows/vm.yml"]
  pull_request:
    paths: ["app/src/vm/**", ".github/workflows/vm.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # the app's own package.json once the shell lands it, else just what this module's tests need
      - run: |
          if [ -f package.json ]; then npm ci || npm install; fi
          npm install --no-save typescript@5.6.3 vitest@2.1.8 @types/node@22 react@18.3.1 react-dom@18.3.1 \
            @types/react@18.3.12 @types/react-dom@18.3.1 jsdom@25.0.1 @testing-library/react@16.1.0 electron@33.2.1
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: typecheck
        run: |
          echo '{"compilerOptions": {"target": "ES2022", "module": "ESNext", "moduleResolution": "Bundler", "strict": true,
            "jsx": "react-jsx", "lib": ["ES2022", "DOM", "DOM.Iterable"], "types": ["node"], "skipLibCheck": true,
            "noEmit": true, "esModuleInterop": true, "isolatedModules": true}, "include": ["src/vm"]}' > tsconfig.vm-ci.json
          npx tsc -p tsconfig.vm-ci.json
      # a real ssh host on the runner: sshd on 127.0.0.1:2222, a user with a venv holding the stand-in pipeline
      - name: ssh test host
        run: |
          sudo apt-get install -y -q openssh-server tmux rsync >/dev/null
          sudo useradd -m -s /bin/bash bhtest && sudo usermod -p '*' bhtest
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          sudo install -d -m 700 -o bhtest -g bhtest /home/bhtest/.ssh
          sudo install -m 600 -o bhtest -g bhtest ~/.ssh/id_ed25519.pub /home/bhtest/.ssh/authorized_keys
          sudo -u bhtest python3 -m venv /home/bhtest/bh-venv
          SP=$(sudo -u bhtest /home/bhtest/bh-venv/bin/python -c 'import site; print(site.getsitepackages()[0])')
          sudo cp -r src/vm/__tests__/fixtures/blackhole_pipeline "$SP/" && sudo chown -R bhtest "$SP/blackhole_pipeline"
          printf '#!/bin/sh\necho "NVIDIA B300 SXM6 AC, 294912, 1024, 3"\n' | sudo tee /usr/local/bin/nvidia-smi >/dev/null
          sudo chmod +x /usr/local/bin/nvidia-smi
          printf 'Port 2222\nListenAddress 127.0.0.1\nPasswordAuthentication no\nUsePAM no\nPidFile /tmp/sshd.pid\n' > /tmp/sshd_config
          sudo mkdir -p /run/sshd && sudo /usr/sbin/sshd -f /tmp/sshd_config
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p 2222 bhtest@127.0.0.1 true
      - run: npx vitest run --config src/vm/vitest.config.ts
        env:
          BHD_TEST_SSH: bhtest@127.0.0.1:2222
