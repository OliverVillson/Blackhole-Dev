<!doctype html><html><head><meta charset="utf-8"><title>Local chat preview</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--void:#000;--ash:#4a0d02;--crimson:#9e1b07;--redshift:#d7261e;--ember:#ff6a00;--flare:#ffae42;--photon:#f5efe6;--text:#f0dccb;--dim:#a2735b;--bg1:#060201;--bg2:#0c0402;--line:#1e0804;--line2:#2b0d05;--sel:#2a0c04}
html,body{margin:0;height:100%;background:#000;color:#f0dccb;font-family:'IBM Plex Sans',system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
.sh-top{height:38px;display:flex;align-items:center;gap:18px;padding:0 14px;background:#0c0402;border-bottom:1px solid #2b0d05;font-size:13px}
.sh-logo{font-family:'Chakra Petch';font-weight:700;letter-spacing:.12em;font-size:14px;color:#f5efe6}.sh-logo b{color:#ff6a00}
.sh-top nav{color:#a2735b;word-spacing:10px}.sh-sp{flex:1}
.sh-chip{border:1px solid #3a1206;border-radius:4px;padding:3px 10px;font-size:12px}
.sh-mid{flex:1;display:flex;min-height:0}
.sh-act{width:52px;background:#060201;border-right:1px solid #1e0804;display:flex;flex-direction:column;color:#a2735b}
.sh-act span{height:48px;display:flex;align-items:center;justify-content:center}.sh-act .on{color:#ff6a00;box-shadow:inset 2px 0 0 #ff6a00}
.sh-side{width:268px;background:#0c0402;border-right:1px solid #1e0804;overflow-y:auto}
.sh-main{flex:1;min-width:0;display:flex;flex-direction:column}
.sh-tabs{display:flex;background:#060201;border-bottom:1px solid #1e0804;font-size:13px;color:#a2735b}
.sh-tabs div{height:36px;display:flex;align-items:center;padding:0 14px;border-right:1px solid #1e0804}
.sh-tabs .on{color:#f5efe6;background:#000;box-shadow:inset 0 2px 0 #ff6a00}
.sh-tab{flex:1;min-height:0}
.sh-foot{height:26px;display:flex;align-items:center;gap:18px;padding:0 12px;background:#9e1b07;color:#f5efe6;font-size:12px}
</style></head><body><div id="app"></div><script src="bundle.js"></script></body></html>
